<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="演出日历" />
    <title>日本音乐演出日历</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/night-music-header.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <span class="eyebrow">YOASOBI × ヨルシカ inspired Asia concert tracker</span>
          <h1>日本/亚洲音乐演出日历</h1>
          <p id="summaryLine"></p>
          <div class="heroStats" aria-label="概览">
            <span id="heroEventStat"></span>
            <span id="heroArtistStat"></span>
            <span>Asia/Tokyo</span>
          </div>
        </div>
        <div class="actions">
          <button id="todayBtn" type="button" title="回到当前月份">今天</button>
          <button id="exportBtn" type="button" title="导出当前筛选结果为 ICS">导出 ICS</button>
        </div>
      </header>

      <section class="filters" aria-label="筛选">
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="歌手 / 国家地区 / 城市 / 会场 / 巡演名" />
        </label>
        <label>
          歌手
          <select id="artistSelect"></select>
        </label>
        <label>
          地区/国家
          <select id="regionSelect"></select>
        </label>
        <label>
          核验
          <select id="confidenceSelect">
            <option value="all">全部</option>
            <option value="official">官方/场馆/票务已核验</option>
            <option value="review">需要复查</option>
          </select>
        </label>
        <label>
          票务
          <select id="ticketSelect"></select>
        </label>
      </section>

      <section class="monthNav" aria-label="月份切换">
        <button id="prevMonth" type="button" title="上个月">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" type="button" title="下个月">›</button>
      </section>

      <section class="calendar" aria-label="月历">
        <div class="weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="calendarGrid" class="grid"></div>
      </section>

      <section class="split">
        <div class="panel">
          <div class="panelHead">
            <h2>演出列表</h2>
            <span id="eventCount"></span>
          </div>
          <div id="eventList" class="eventList"></div>
        </div>
        <aside class="panel">
          <div class="panelHead">
            <h2>待继续复查</h2>
            <span id="emptyCount"></span>
          </div>
          <div id="emptyArtists" class="emptyArtists"></div>
        </aside>
      </section>
    </main>

    <script src="data-meta.js"></script>
    <script src="data-events-1.js"></script>
    <script src="data-events-2.js"></script>
    <script src="data-events-3.js"></script>
    <script src="data-events-4.js"></script>
    <script src="data-events-5.js"></script>
    <script src="data-events-6.js"></script>
    <script src="data-events-7.js"></script>
    <script src="data-events-8.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
